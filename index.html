<!doctype html><html lang="uz"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRAND MARKET</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f7f7;font:16px system-ui;color:#252525}main{max-width:600px;margin:auto;padding:18px}header{background:#d71920;color:white;padding:20px}h1{margin:0}small{color:#777}header small{color:white}.box{background:white;border-radius:14px;padding:16px;margin:14px 0;box-shadow:0 2px 8px #0001}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #eee}button{border:0;border-radius:9px;padding:10px 14px;background:#d71920;color:white;font-weight:700}button:disabled{opacity:.4}input{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;margin:6px 0 12px;font-size:16px}.tag{background:#ffeded;color:#ad0000;padding:12px;border-radius:10px}#message{font-weight:bold}</style><header><h1>GRAND MARKET</h1><small>Ангрен • 09:00–23:00 • Доставка</small></header><main><div class="tag">300 000 сўмдан бошлаб бепул доставка • Демо каталог: 6 маҳсулот</div><div class="box"><h2>🛒 Маҳсулотлар</h2><input id="search" placeholder="Маҳсулот қидириш" oninput="render()"><div id="products"></div></div><div class="box"><h2>🧺 Саватча</h2><div id="cart"></div><b id="sum"></b></div><div class="box"><h2>🚗 Буюртма бериш</h2><small>Нархлар ва қолдиқлар ҳозирча 1С билан синхрон эмас. Доставка масофасини администратор тасдиқлайди.</small><input id="name" placeholder="Исмингиз"><input id="phone" type="tel" placeholder="Телефон рақамингиз"><input id="address" placeholder="Ангрен шаҳридаги манзилингиз"><input id="distance" type="number" min="0" max="50" step="0.1" placeholder="Дўкондан масофа (км)"><button id="submit" onclick="submitOrder()">Буюртма юбориш</button><p id="message"></p></div></main><script>let products=[],cart={};const fmt=n=>n.toLocaleString('ru-RU')+' сўм';fetch('/api/products').then(r=>r.json()).then(p=>{products=p;render()}).catch(()=>document.getElementById('message').textContent='Серверга уланиб бўлмади');function add(id,n){cart[id]=Math.max(0,(cart[id]||0)+n);render()}function render(){let q=document.getElementById('search').value.toLowerCase();document.getElementById('products').innerHTML=products.filter(p=>p.uz.toLowerCase().includes(q)||p.ru.toLowerCase().includes(q)).map(p=>`<div class="row"><span>${p.icon} ${p.uz}<br><small>${fmt(p.price)}</small></span><button onclick="add(${p.id},1)">+ Қўшиш</button></div>`).join('');let chosen=products.filter(p=>cart[p.id]>0);document.getElementById('cart').innerHTML=chosen.map(p=>`<div class="row"><span>${p.uz} × ${cart[p.id]}</span><span><button onclick="add(${p.id},-1)">−</button> <button onclick="add(${p.id},1)">+</button></span></div>`).join('')||'Саватча бўш';document.getElementById('sum').textContent='Маҳсулотлар: '+fmt(chosen.reduce((s,p)=>s+p.price*cart[p.id],0))}async function submitOrder(){let btn=document.getElementById('submit'),msg=document.getElementById('message');btn.disabled=true;msg.textContent='Юборилмоқда...';try{let data={customer:document.getElementById('name').value,phone:document.getElementById('phone').value,address:document.getElementById('address').value,distance:document.getElementById('distance').value,items:Object.entries(cart).filter(([id,q])=>q>0).map(([id,qty])=>({id:+id,qty}))};let r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),v=await r.json();if(!r.ok)throw Error(v.error||'Хатолик');msg.textContent=`Буюртма #${v.id} қабул қилинди. Жами ${fmt(v.total)}. Администратор тасдиқлашини кутинг.`;cart={};render()}catch(e){msg.textContent=e.message}finally{btn.disabled=false}}</script></html>
