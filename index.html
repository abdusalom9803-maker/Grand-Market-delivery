<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GRAND MARKET — Доставка</title>
<style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#202a23;background:#f3f6f3}*{box-sizing:border-box}body{margin:0}.container{max-width:1120px;margin:auto;padding:0 16px}header{background:#fff;border-bottom:1px solid #e3e8e4;position:sticky;top:0;z-index:10}.top{display:flex;align-items:center;gap:12px;justify-content:space-between;min-height:75px}.logo{font-size:25px;letter-spacing:-.6px;font-weight:900;color:#18643d}.logo b{color:#d5262f}.tag{color:#68746d;font-size:12px}.cartbtn{background:#d5262f;color:white;border:0;border-radius:12px;padding:13px 16px;cursor:pointer;font-weight:750}main{padding:18px 0 80px}.hero{background:linear-gradient(115deg,#166441,#278d59);color:#fff;border-radius:18px;padding:24px;margin-bottom:18px}.hero h1{font-size:26px;margin:0 0 8px}.hero p{margin:0;font-size:14px;opacity:.92}.toolbar{background:white;border:1px solid #e5ebe6;border-radius:14px;padding:16px;margin-bottom:16px}.input{width:100%;font:inherit;border:1px solid #d9e1dc;background:#fff;border-radius:10px;padding:13px;margin:6px 0 12px}.searchrow{display:flex;gap:10px;align-items:center}.searchrow input{flex:1;margin:0}.pills{display:flex;gap:8px;overflow:auto;padding-top:14px;scrollbar-width:thin}.pill{border:1px solid #dbe5de;color:#345b44;background:#f8fbf9;border-radius:20px;white-space:nowrap;padding:9px 14px;font-size:13px;cursor:pointer}.pill.active{background:#18643d;color:white}.status{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px;color:#5e6d63;font-size:14px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:white;border:1px solid #e2e9e5;border-radius:14px;overflow:hidden;display:flex;flex-direction:column}.photo{height:146px;background:#f1f5f1;display:grid;place-items:center;font-size:54px}.photo img{width:100%;height:100%;object-fit:contain}.cardbody{padding:13px;flex:1;display:flex;flex-direction:column}.card h3{font-size:13px;line-height:1.45;min-height:42px;margin:0 0 10px;overflow-wrap:anywhere}.price{font-size:19px;font-weight:850;color:#c71e29;margin-top:auto}.stock{color:#708078;font-size:12px;margin-top:4px}.add{background:#d5262f;color:white;border:none;border-radius:10px;padding:11px;margin-top:12px;cursor:pointer;font-weight:700}.pages{display:flex;justify-content:center;align-items:center;gap:12px;margin:24px 0}.pages button{border:1px solid #d5ded7;background:white;border-radius:8px;padding:10px 15px;font:inherit}.pages button:disabled{opacity:.4}.muted{color:#778279}.overlay{position:fixed;inset:0;background:#121e16aa;z-index:30;display:none;justify-content:flex-end}.overlay.on{display:flex}.drawer{height:100%;overflow:auto;background:#fff;width:min(100%,450px);padding:20px;box-shadow:-4px 0 30px #0003}.drawerhead{display:flex;align-items:center;justify-content:space-between}.drawer h2{margin:8px 0}.close{border:0;background:#edf2ee;border-radius:8px;padding:10px 15px;font-size:18px}.cartrow{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px 0;border-bottom:1px solid #eaeaea}.cartrow small{display:block;margin-top:4px;color:#667}.qtyrow{display:flex;align-items:center;gap:9px}.qtyrow button{width:34px;height:34px;border:0;border-radius:7px;background:#eff3f0;font-size:18px}.primary{width:100%;background:#d5262f;color:white;font:inherit;font-weight:750;padding:13px;border:0;border-radius:12px;margin-top:14px}.primary:disabled{opacity:.55}.totalrow{display:flex;justify-content:space-between;margin:10px 0}.warn{background:#fff4e7;border-radius:10px;padding:12px;color:#775322;font-size:13px;margin:14px 0}.link{color:#26754c;text-decoration:none}.cartlabels{font-size:13px;font-weight:650;display:block;margin-top:12px}.msg{padding:12px;margin-top:12px;border-radius:10px;background:#eef8f1;color:#185739;white-space:pre-wrap}.error{background:#fff0ef;color:#a1221e}.hidden{display:none!important}@media(max-width:800px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:540px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.photo{height:128px}.card h3{font-size:12px}.price{font-size:17px}.hero{padding:18px}.hero h1{font-size:22px}.tag{display:none}.container{padding:0 12px}.cardbody{padding:10px}}
</style></head>
<body><header><div class="container top"><div><div class="logo">GRAND <b>MARKET</b></div><div class="tag">Сизнинг онлайн супермаркетингиз</div></div><button class="cartbtn" id="cartOpen">🛒 Саватча <span id="cartCount">0</span></button></div></header>
<main class="container"><div class="hero"><h1>GRAND MARKET DELIVERY</h1><p>300 000 сўмдан бошлаб етказиб бериш бепул • Тўлов етказилганда</p></div>
<section class="toolbar"><div class="searchrow"><input class="input" style="margin:0" id="search" placeholder="Маҳсулот номи бўйича қидириш..."></div><div class="pills" id="pills"><button class="pill active" data-view="featured">⭐ ТОП-200</button><button class="pill" data-view="all">🛒 Барча маҳсулотлар</button></div><div class="pills" id="categories"></div></section>
<div class="status"><span id="status">Каталог юкланмоқда...</span><span class="muted" id="pageText"></span></div><div id="grid" class="grid"></div><div class="pages" id="pages"></div></main>
<div class="overlay" id="overlay"><aside class="drawer"><div class="drawerhead"><h2>🛒 Саватча</h2><button class="close" id="cartClose">✕</button></div><div id="cartLines"></div><div class="totalrow"><span>Маҳсулотлар</span><b id="subtotal">0 сўм</b></div><div class="totalrow"><span>Доставка</span><b id="delivery">0 сўм</b></div><div class="totalrow"><b>Жами</b><b id="total">0 сўм</b></div><div class="warn">Доставка масофаси дастлабки ҳисоб. Буюртмани администратор тасдиқлайди.</div>
<label class="cartlabels" for="customer">Исмингиз</label><input class="input" id="customer" autocomplete="name" maxlength="100" placeholder="Исмингиз">
<label class="cartlabels" for="phone">Телефон</label><input class="input" id="phone" type="tel" placeholder="+998 90 123 45 67">
<label class="cartlabels" for="address">Манзил</label><textarea class="input" id="address" rows="2" placeholder="Шаҳар, кўча, уй"></textarea>
<label class="cartlabels" for="distance">Дўкондан масофа (км)</label><input class="input" id="distance" type="number" min="0" max="50" step="0.1" value="3">
<button class="primary" id="orderSend">Буюртма юбориш</button><p class="msg hidden" id="orderMsg"></p></aside></div>
<script>
const $=id=>document.getElementById(id);const money=n=>Number(n||0).toLocaleString('ru-RU')+' сўм';const cart=new Map();let view='featured',category='',page=1,searchTimer=null,reqCounter=0;
const icon=p=>{const s=(p.category||'').toLowerCase();return s.includes('ичимлик')?'🥤':s.includes('мева')?'🍏':s.includes('ширин')?'🍬':s.includes('сут')?'🥛':s.includes('нон')?'🥖':s.includes('гўшт')?'🍗':'🛒'};
function el(t,cls,text){const e=document.createElement(t);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
async function loadCategories(){try{const cats=await(await fetch('/api/categories')).json();const box=$('categories');box.replaceChildren();for(const c of cats){const b=el('button','pill',c.category+' ('+c.count+')');b.onclick=()=>{category=c.category;view='all';page=1;updatePills();loadProducts()};box.append(b)}}catch(e){}}
function updatePills(){for(const b of $('pills').querySelectorAll('[data-view]'))b.classList.toggle('active',b.dataset.view===view);for(const b of $('categories').children)b.classList.toggle('active',category&&b.textContent.startsWith(category+' ('))}
async function loadProducts(){const seq=++reqCounter;const q=$('search').value.trim();const u=new URLSearchParams({page:String(page),limit:'24'});if(q)u.set('q',q);if(category)u.set('category',category);if(view==='featured'&&!q&&!category)u.set('featured','1');$('status').textContent='Маҳсулотлар юкланмоқда...';try{const r=await fetch('/api/products?'+u);if(!r.ok)throw Error('Сервер хатоси');const data=await r.json();if(seq!==reqCounter)return;const grid=$('grid');grid.replaceChildren();$('status').textContent=data.total.toLocaleString('ru-RU')+' та маҳсулот';$('pageText').textContent='Саҳифа '+data.page+' / '+Math.max(1,data.pages);for(const p of data.items){const card=el('article','card'),photo=el('div','photo');if(p.image_url){const img=el('img');img.src=p.image_url;img.loading='lazy';img.alt=p.uz;img.onerror=()=>{photo.replaceChildren(el('span','',icon(p)))};photo.append(img)}else photo.append(el('span','',icon(p)));card.append(photo);const body=el('div','cardbody');body.append(el('h3','',p.uz),el('div','price',money(p.price)),el('div','stock','Код: '+p.code));const add=el('button','add','+ Саватчага');add.onclick=()=>addCart(p);body.append(add);card.append(body);grid.append(card)}if(!data.items.length)grid.append(el('p','muted','Ҳозирча маҳсулот топилмади.'));const pages=$('pages');pages.replaceChildren();if(data.pages>1){const prev=el('button','','← Олдинги');prev.disabled=page<=1;prev.onclick=()=>{page--;loadProducts();window.scrollTo(0,0)};const next=el('button','','Кейинги →');next.disabled=page>=data.pages;next.onclick=()=>{page++;loadProducts();window.scrollTo(0,0)};pages.append(prev,el('span','',String(page)+' / '+data.pages),next)}}catch(e){if(seq===reqCounter)$('status').textContent='Сервердан маҳсулот олиб бўлмади. Саҳифани янгиланг.'}}
function addCart(p){const old=cart.get(String(p.code));if(old){old.qty+=1}else cart.set(String(p.code),{p,qty:1});renderCart()}
function setQty(code,diff){const x=cart.get(String(code));if(!x)return;x.qty=Math.max(0,x.qty+diff);if(!x.qty)cart.delete(String(code));renderCart()}
function calc(){let sub=0;for(const {p,qty} of cart.values())sub+=p.price*qty;const dist=Number($('distance').value)||0;const delivery=!sub||sub>=300000?0:dist<=3?10000:dist<=5?15000:20000;return {sub,delivery}}
function renderCart(){const box=$('cartLines');box.replaceChildren();let num=0;for(const [code,{p,qty}] of cart){num+=qty;const row=el('div','cartrow');const name=el('div');name.append(el('b','',p.uz),el('small','',money(p.price)+' × '+qty));const controls=el('div','qtyrow');const minus=el('button','','−'),plus=el('button','','+');minus.onclick=()=>setQty(code,-1);plus.onclick=()=>setQty(code,1);controls.append(minus,el('b','',String(qty)),plus);row.append(name,controls);box.append(row)}if(!cart.size)box.append(el('p','muted','Саватча бўш'));$('cartCount').textContent=String(num);const {sub,delivery}=calc();$('subtotal').textContent=money(sub);$('delivery').textContent=money(delivery);$('total').textContent=money(sub+delivery)}
$('pills').onclick=e=>{const b=e.target.closest('[data-view]');if(!b)return;view=b.dataset.view;category='';page=1;updatePills();loadProducts()};$('search').oninput=()=>{page=1;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{category='';if($('search').value.trim())view='all';updatePills();loadProducts()},280)};
$('cartOpen').onclick=()=>{$('overlay').classList.add('on');renderCart()};$('cartClose').onclick=()=>{$('overlay').classList.remove('on')};$('overlay').onclick=e=>{if(e.target===$('overlay'))$('overlay').classList.remove('on')};$('distance').oninput=renderCart;
$('orderSend').onclick=async()=>{const msg=$('orderMsg');msg.classList.add('hidden');if(!cart.size){alert('Саватча бўш');return}const btn=$('orderSend');btn.disabled=true;try{const body={customer:$('customer').value,phone:$('phone').value,address:$('address').value,distance:$('distance').value,items:[...cart.values()].map(({p,qty})=>({id:p.id,qty}))};const response=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const result=await response.json();if(!response.ok)throw Error(result.error||'Хатолик');msg.textContent='✅ Буюртмангиз қабул қилинди! №'+result.id+'\nЖами: '+money(result.total)+'\nАдминистратор сиз билан боғланади.';msg.classList.remove('error');cart.clear();renderCart()}catch(e){msg.textContent=e.message;msg.classList.add('error')}finally{msg.classList.remove('hidden');btn.disabled=false}};
loadCategories();loadProducts();renderCart();
</script></body></html>
